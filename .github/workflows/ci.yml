name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS — scan for leaked secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --only-verified --results=verified,unknown

      - name: Gitleaks — scan for secrets in git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          cd backend
          pip-audit -r requirements.txt --desc || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high || true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  hardening-check:
    name: Code Hardening Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets patterns
        run: |
          set +e
          echo "Scanning for hardcoded API keys, tokens, and passwords..."
          
          PATTERNS=(
            'sk-or-v1-[a-zA-Z0-9]{20,}'
            'sk-ant-[a-zA-Z0-9]{20,}'
            'sk-proj-[a-zA-Z0-9]{20,}'
            'sk-[a-zA-Z0-9]{40,}'
            'AKIA[0-9A-Z]{16}'
            'ghp_[a-zA-Z0-9]{36}'
            'gho_[a-zA-Z0-9]{36}'
            'xox[baprs]-[a-zA-Z0-9-]+'
            'AIza[0-9A-Za-z\-_]{35}'
            '-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
          )
          
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            matches=$(grep -rnE "$pattern" --include='*.py' --include='*.js' --include='*.ts' --include='*.html' --include='*.yml' --include='*.yaml' --include='*.json' --include='*.sh' --include='*.env' . 2>/dev/null | grep -v node_modules | grep -v '.git/' | grep -v 'package-lock' | grep -v 'test-results')
            if [ -n "$matches" ]; then
              echo "::error::Potential secret found matching pattern: $pattern"
              echo "$matches"
              FOUND=1
            fi
          done
          
          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Hardcoded secrets detected. Remove them and use environment variables / GitHub secrets instead."
            exit 1
          fi
          echo "No hardcoded secrets detected."

      - name: Check .env is gitignored
        run: |
          if ! grep -qE '^\.env$|^\.env\b' .gitignore 2>/dev/null; then
            echo "::error::.env is not in .gitignore"
            exit 1
          fi
          echo ".env is properly gitignored."

      - name: Check for SQL injection patterns
        run: |
          set +e
          matches=$(grep -rnE "execute\s*\(\s*['\"].*%s.*['\"]\s*%|execute\s*\(\s*f['\"]" --include='*.py' . 2>/dev/null | grep -v node_modules | grep -v '.git/' | grep -v __pycache__ | grep -v test)
          if [ -n "$matches" ]; then
            echo "::warning::Potential SQL injection (string formatting in queries):"
            echo "$matches"
          fi
          echo "SQL injection check complete."

      - name: Verify no secrets in docker-compose files
        run: |
          set +e
          matches=$(grep -rnE '(password|secret|api_key|token)\s*[:=]\s*[^$\{]' docker-compose*.yml 2>/dev/null | grep -v '\$\{' | grep -v 'example')
          if [ -n "$matches" ]; then
            echo "::error::Hardcoded secrets in docker-compose files:"
            echo "$matches"
            exit 1
          fi
          echo "Docker-compose files use secrets/env vars correctly."

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-audit, hardening-check]
    if: ${{ (github.event_name == 'push' && needs.secret-scan.result == 'success' && needs.dependency-audit.result == 'success' && needs.hardening-check.result == 'success') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            REPO_DIR="/opt/hive"

            if [ ! -d "$REPO_DIR" ]; then
              git clone https://github.com/rShetty/hive.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main

            # Write env file from secrets (preserves all config)
            cat > .env << EOF
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            HIVE_URL=http://localhost:8080
            HIVE_URL_OVERRIDE=https://hive.rajeev.me
            ALLOWED_ORIGINS_OVERRIDE=https://hive.rajeev.me
            HIVE_DOMAIN=hive.rajeev.me
            HIVE_SSL_CERT=/etc/letsencrypt/live/hive.rajeev.me/fullchain.pem
            HIVE_SSL_KEY=/etc/letsencrypt/live/hive.rajeev.me/privkey.pem
            COOKIE_SECURE=1
            EOF

            # Build agent image
            docker build -t agent-marketplace-agent:latest -f docker/Dockerfile.agent docker/ || true

            # Rebuild and restart the marketplace container
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # Wait for startup and verify health
            sleep 10
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8080/api/health; then
                echo ""
                echo "DEPLOY SUCCESS: hive.rajeev.me is healthy"
                exit 0
              fi
              echo "Health check attempt $i failed, waiting..."
              sleep 5
            done

            echo "ERROR: Health check failed after 5 attempts"
            docker compose -f docker-compose.prod.yml logs --tail=50
            exit 1
