# Alembic configuration for Hive (issue #14).
#
# The database URL is resolved at runtime by backend/alembic/env.py from
# ALEMBIC_DATABASE_URL / DATABASE_URL — the sqlalchemy.url below is only a
# fallback and is never used when either env var is set.

[alembic]
# %(here)s = the directory containing this ini file, so the migration scripts
# resolve regardless of the process working directory (container startup runs
# from /app/backend, local dev from wherever).
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
