name: CI/CD

# All third-party actions are pinned to full commit SHAs (immutable).
# To bump one, resolve the tag to a commit first:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 is REQUIRED: gitleaks must scan the FULL commit history.
      # Never reduce this to a shallow clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS — scan for leaked secrets
        uses: trufflesecurity/trufflehog@3ab759fef4bb5935d4fe9ac68b503d05346b8364 # main (pinned; do not float)
        with:
          path: .
          extra_args: --only-verified --results=verified,unknown

      - name: Gitleaks — scan for secrets in git history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: |
          # Blocking gate. If a finding is a confirmed false positive, suppress
          # it explicitly with a documented `pip-audit --ignore-vuln <ID>` flag
          # here — never with a bare `|| true`.
          cd backend
          pip-audit --ignore-vuln PYSEC-2026-1325 --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-2263 --ignore-vuln PYSEC-2026-3455 --ignore-vuln PYSEC-2026-3456 --ignore-vuln PYSEC-2026-3457 --ignore-vuln PYSEC-2025-185 --ignore-vuln PYSEC-2026-1845 -r requirements.txt --desc

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Audit npm dependencies
        run: |
          # Blocking gate at high+ severity for production deps.
          # Any exception requires an explicit, documented override in this step
          # (e.g. `npm audit --omit=dev --audit-level=high || echo "documented reason"`)
          # — never a bare `|| true`.
          npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@42947a340483f03ba47bb1a039b2c519aab3df85 # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          category: "/language:${{ matrix.language }}"

  hardening-check:
    name: Code Hardening Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check for hardcoded secrets patterns
        run: |
          set +e
          echo "Scanning for hardcoded API keys, tokens, and passwords..."
          
          PATTERNS=(
            'sk-or-v1-[a-zA-Z0-9]{20,}'
            'sk-ant-[a-zA-Z0-9]{20,}'
            'sk-proj-[a-zA-Z0-9]{20,}'
            'sk-[a-zA-Z0-9]{40,}'
            'AKIA[0-9A-Z]{16}'
            'ghp_[a-zA-Z0-9]{36}'
            'gho_[a-zA-Z0-9]{36}'
            'xox[baprs]-[a-zA-Z0-9-]+'
            'AIza[0-9A-Za-z\-_]{35}'
            '-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
          )
          
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            matches=$(grep -rnE "$pattern" --include='*.py' --include='*.js' --include='*.ts' --include='*.html' --include='*.yml' --include='*.yaml' --include='*.json' --include='*.sh' --include='*.env' . 2>/dev/null | grep -v node_modules | grep -v '.git/' | grep -v 'package-lock' | grep -v 'test-results')
            if [ -n "$matches" ]; then
              echo "::error::Potential secret found matching pattern: $pattern"
              echo "$matches"
              FOUND=1
            fi
          done
          
          if [ "$FOUND" -eq 1 ]; then
            echo "::error::Hardcoded secrets detected. Remove them and use environment variables / GitHub secrets instead."
            exit 1
          fi
          echo "No hardcoded secrets detected."

      - name: Check .env is gitignored
        run: |
          if ! grep -qE '^\.env$|^\.env\b' .gitignore 2>/dev/null; then
            echo "::error::.env is not in .gitignore"
            exit 1
          fi
          echo ".env is properly gitignored."

      - name: Fail if .env is ever tracked in git
        run: |
          TRACKED="$(git ls-files | grep -E '(^|/)\.env$' || true)"
          if [ -n "$TRACKED" ]; then
            echo "::error::.env is tracked in git: $TRACKED"
            echo "::error::Remove it from the index ('git rm --cached .env') and rotate EVERY value inside it (see docs/security/KEY_ROTATION.md)."
            exit 1
          fi
          echo ".env is not tracked."

      - name: Check for SQL injection patterns
        run: |
          set +e
          matches=$(grep -rnE "execute\s*\(\s*['\"].*%s.*['\"]\s*%|execute\s*\(\s*f['\"]" --include='*.py' . 2>/dev/null | grep -v node_modules | grep -v '.git/' | grep -v __pycache__ | grep -v test)
          if [ -n "$matches" ]; then
            echo "::warning::Potential SQL injection (string formatting in queries):"
            echo "$matches"
          fi
          echo "SQL injection check complete."

      - name: Verify no secrets in docker-compose files
        run: |
          set +e
          matches=$(grep -rnE '(password|secret|api_key|token)\s*[:=]\s*[^$\{]' docker-compose*.yml 2>/dev/null | grep -v '\$\{' | grep -v 'example')
          if [ -n "$matches" ]; then
            echo "::error::Hardcoded secrets in docker-compose files:"
            echo "$matches"
            exit 1
          fi
          echo "Docker-compose files use secrets/env vars correctly."

  backend-smoke:
    name: Backend Smoke Test (compileall + pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Mirrors local verification: reuse .venv-enterprise when present,
      # otherwise build it fresh from backend/requirements.txt.
      # setup-python provides the isolated interpreter; a nested venv is
      # unnecessary and fails on some runner images (missing bin/python).
      - name: Install backend dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt httpx

      - name: Byte-compile backend sources (python -m compileall)
        run: python -m compileall backend

      # Issue #10: run the unit tests, not just collection. The suite is
      # hermetic (conftest.py provides SECRET_KEY/HIVE_SIGNING_SECRET and a
      # temp SQLite DB), so no services are needed.
      - name: Unit tests (pytest)
        run: python -m pytest -q

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-audit, codeql, hardening-check, backend-smoke]
    if: ${{ (github.event_name == 'push' && needs.secret-scan.result == 'success' && needs.dependency-audit.result == 'success' && needs.codeql.result == 'success' && needs.hardening-check.result == 'success' && needs.backend-smoke.result == 'success') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Deploy via SSH (with retries)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e

            REPO_DIR="/opt/hive"

            if [ ! -d "$REPO_DIR" ]; then
              git clone https://github.com/rShetty/hive.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main

            # Load persisted secrets from the server's .env (if it exists)
            # so we don't lose HIVE_SIGNING_SECRET between deploys.
            EXISTING_HIVE_SIGNING_SECRET=""
            if [ -f .env ]; then
              EXISTING_HIVE_SIGNING_SECRET=$(grep -E '^HIVE_SIGNING_SECRET=' .env 2>/dev/null | cut -d'=' -f2- || true)
            fi

            # Generate HIVE_SIGNING_SECRET if not already persisted and not
            # provided via GitHub secrets.
            if [ -z "$EXISTING_HIVE_SIGNING_SECRET" ]; then
              EXISTING_HIVE_SIGNING_SECRET="${{ secrets.HIVE_SIGNING_SECRET }}"
              if [ -z "$EXISTING_HIVE_SIGNING_SECRET" ]; then
                echo "Generating new HIVE_SIGNING_SECRET (first deploy)..."
                EXISTING_HIVE_SIGNING_SECRET=$(openssl rand -hex 32)
              fi
            fi

            # Write env file from secrets + persisted values (preserves all config)
            cat > .env << EOF
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            HIVE_SIGNING_SECRET=$EXISTING_HIVE_SIGNING_SECRET
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            HIVE_URL=http://localhost:8080
            HIVE_URL_OVERRIDE=https://hive.rajeev.me
            ALLOWED_ORIGINS_OVERRIDE=https://hive.rajeev.me
            HIVE_DOMAIN=hive.rajeev.me
            HIVE_SSL_CERT=/etc/letsencrypt/live/hive.rajeev.me/fullchain.pem
            HIVE_SSL_KEY=/etc/letsencrypt/live/hive.rajeev.me/privkey.pem
            COOKIE_SECURE=1
            MARKETPLACE_URL=https://hive.rajeev.me
            EOF

            # Build agent image
            docker build -t agent-marketplace-agent:latest -f docker/Dockerfile.agent docker/ || true

            # Rebuild and restart the marketplace container
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # Wait for startup and verify health
            sleep 10
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8080/api/health; then
                echo ""
                echo "DEPLOY SUCCESS: hive.rajeev.me is healthy"
                exit 0
              fi
              echo "Health check attempt $i failed, waiting..."
              sleep 5
            done

            echo "ERROR: Health check failed after 5 attempts"
            docker compose -f docker-compose.prod.yml logs --tail=50
            exit 1

      - name: Retry deploy if SSH failed
        if: failure()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e

            REPO_DIR="/opt/hive"

            if [ ! -d "$REPO_DIR" ]; then
              git clone https://github.com/rShetty/hive.git "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git fetch origin main
            git reset --hard origin/main

            # Load persisted HIVE_SIGNING_SECRET from existing .env
            EXISTING_HIVE_SIGNING_SECRET=""
            if [ -f .env ]; then
              EXISTING_HIVE_SIGNING_SECRET=$(grep -E '^HIVE_SIGNING_SECRET=' .env 2>/dev/null | cut -d'=' -f2- || true)
            fi
            if [ -z "$EXISTING_HIVE_SIGNING_SECRET" ]; then
              EXISTING_HIVE_SIGNING_SECRET="${{ secrets.HIVE_SIGNING_SECRET }}"
              if [ -z "$EXISTING_HIVE_SIGNING_SECRET" ]; then
                EXISTING_HIVE_SIGNING_SECRET=$(openssl rand -hex 32)
              fi
            fi

            cat > .env << EOF
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            HIVE_SIGNING_SECRET=$EXISTING_HIVE_SIGNING_SECRET
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            HIVE_URL=http://localhost:8080
            HIVE_URL_OVERRIDE=https://hive.rajeev.me
            ALLOWED_ORIGINS_OVERRIDE=https://hive.rajeev.me
            HIVE_DOMAIN=hive.rajeev.me
            HIVE_SSL_CERT=/etc/letsencrypt/live/hive.rajeev.me/fullchain.pem
            HIVE_SSL_KEY=/etc/letsencrypt/live/hive.rajeev.me/privkey.pem
            COOKIE_SECURE=1
            MARKETPLACE_URL=https://hive.rajeev.me
            EOF

            docker build -t agent-marketplace-agent:latest -f docker/Dockerfile.agent docker/ || true
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            sleep 10
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:8080/api/health; then
                echo ""
                echo "DEPLOY SUCCESS (retry): hive.rajeev.me is healthy"
                exit 0
              fi
              echo "Health check attempt $i failed, waiting..."
              sleep 5
            done

            echo "ERROR: Health check failed after 5 attempts"
            docker compose -f docker-compose.prod.yml logs --tail=50
            exit 1

      - name: Retry deploy (2nd retry)
        if: failure()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 90s
          command_timeout: 30m
          script: |
            set -e

            cd /opt/hive
            git fetch origin main
            git reset --hard origin/main

            # Load persisted HIVE_SIGNING_SECRET from existing .env
            EXISTING_HIVE_SIGNING_SECRET=""
            if [ -f .env ]; then
              EXISTING_HIVE_SIGNING_SECRET=$(grep -E '^HIVE_SIGNING_SECRET=' .env 2>/dev/null | cut -d'=' -f2- || true)
            fi
            if [ -z "$EXISTING_HIVE_SIGNING_SECRET" ]; then
              EXISTING_HIVE_SIGNING_SECRET="${{ secrets.HIVE_SIGNING_SECRET }}"
              if [ -z "$EXISTING_HIVE_SIGNING_SECRET" ]; then
                EXISTING_HIVE_SIGNING_SECRET=$(openssl rand -hex 32)
              fi
            fi

            cat > .env << EOF
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            HIVE_SIGNING_SECRET=$EXISTING_HIVE_SIGNING_SECRET
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            HIVE_URL=http://localhost:8080
            HIVE_URL_OVERRIDE=https://hive.rajeev.me
            ALLOWED_ORIGINS_OVERRIDE=https://hive.rajeev.me
            HIVE_DOMAIN=hive.rajeev.me
            HIVE_SSL_CERT=/etc/letsencrypt/live/hive.rajeev.me/fullchain.pem
            HIVE_SSL_KEY=/etc/letsencrypt/live/hive.rajeev.me/privkey.pem
            COOKIE_SECURE=1
            MARKETPLACE_URL=https://hive.rajeev.me
            EOF

            docker build -t agent-marketplace-agent:latest -f docker/Dockerfile.agent docker/ || true
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            sleep 10
            curl -sf http://localhost:8080/api/health && echo "" && echo "DEPLOY SUCCESS (retry 2)" || (echo "FAILED" && docker compose -f docker-compose.prod.yml logs --tail=50 && exit 1)
