title = "hive gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Documentation placeholders and test fixtures ONLY. Historical commits are NOT exempted: any secret found in history must be rotated (see docs/security/KEY_ROTATION.md), never allowlisted."

paths = [
  '''docs/.*\.md''',
  '''END_TO_END_FLOW\.md''',
  '''MARKETPLACE_IMPLEMENTATION\.md''',
  '''tests/.*\.py''',
]

regexes = [
  '''sk-or-v1-test-placeholder''',
  '''your-api-key''',
  '''YOUR_AGENT_API_KEY''',
  '''YOUR_JWT_TOKEN''',
  '''AGENT_A_KEY''',
  '''CODEBOT_KEY''',
  '''ALICE_JWT''',
  '''EXECUTING_AGENT_API_KEY''',
  '''eyJ0eXAiOiJKV1QiLCJhbGci\.\.\.''',
  '''\*\*\*;3;m''',
]
